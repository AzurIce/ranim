[package]
name = "benches"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lib]
bench = false

[dependencies]
itertools.workspace = true
criterion = { version = "0.8.2", features = ["html_reports"] }
ranim = { path = "../", features = ["render", "gltf"] }
ranim-core = { path = "../packages/ranim-core" }
ranim-render = { path = "../packages/ranim-render" }
wgpu = { workspace = true }
pollster = "1.0.1"

[[bench]]
name = "eval"
harness = false

[[bench]]
name = "render"
harness = false

[[bench]]
name = "extract"
harness = false

[[bench]]
name = "gpu_render"
harness = false

[[bench]]
name = "svg_tree"
harness = false

[[bench]]
name = "svg_hierarchy"
harness = false

[features]
# Enables wgpu-profiler GPU pass scopes in the profiling binaries.
# Forces a device poll per frame (see profile_gpu_upload --help text).
gpu-scopes = ["ranim-render/profiling"]
