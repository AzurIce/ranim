harness = false

[[bench]]
name = "render"
harness = false

[[bench]]
name = "frame"
harness = false

[[bench]]
name = "gpu_render"
harness = false

[[bench]]
name = "svg_tree"
harness = false

[[bench]]
name = "svg_hierarchy"
