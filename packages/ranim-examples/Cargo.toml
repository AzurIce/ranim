[package]
name = "ranim-examples"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lib]
crate-type = ["rlib"]
path = "../../examples/ranim_examples_bundle.rs"

[[bin]]
name = "ranim-examples-preview"
path = "src/main.rs"

[features]
default = ["render"]
render = ["ranim/render", "dep:bevy_app"]

[dependencies]
bevy_app = { workspace = true, optional = true }
ranim = { workspace = true, features = ["preview", "anims", "items", "typst"] }
ranim-core.workspace = true
ranim-items.workspace = true
ranim-anims.workspace = true
itertools.workspace = true
rand = "0.10.3"
rand_chacha = "0.10.0"
midly = "0.5.3"
getrandom = { version = "0.4.3", features = ["wasm_js"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen.workspace = true
console_error_panic_hook = "0.1.7"
wasm-tracing = "2.1.0"

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs", "--html-in-header", "docs-rs/header.html"]
