[package]
name = "ranim-examples"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

# Keep the crate root beside the example modules for rust-analyzer.
[lib]
crate-type = ["rlib"]
path = "../../examples/ranim_examples_bundle.rs"

[features]
default = ["render"]
# Matches the shared scenes' render configuration gates without native UI.
render = ["ranim/render"]

[dependencies]
bevy_app.workspace = true
ranim = { workspace = true, features = ["anims", "items", "typst", "gltf"] }
ranim-core.workspace = true
ranim-items.workspace = true
ranim-anims.workspace = true
itertools.workspace = true
rand = "0.10.3"
rand_chacha = "0.10.0"
midly = "0.5.3"
getrandom = { version = "0.4.3", features = ["wasm_js"] }

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs", "--html-in-header", "docs-rs/header.html"]
