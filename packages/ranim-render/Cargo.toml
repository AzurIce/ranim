[package]
name = "ranim-render"
description = "The renderer of Ranim."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[features]
profiling = ["dep:wgpu-profiler", "dep:puffin", "dep:profiling"]

[dependencies]
ranim-core.workspace = true
wgpu-profiler = { workspace = true, optional = true }
puffin = { version = "0.20.0", optional = true }
profiling = { version = "1.0.18", optional = true, features = [
  "profile-with-puffin",
] }
image.workspace = true
tracing.workspace = true
bytemuck = { workspace = true, features = ["derive"] }
glam = { workspace = true, features = ["bytemuck"] }
pollster = "1.0.1"
async-channel = "2.5.0"
variadics_please = "2.0.0"
slotmap = "1.1.1"

[target.'cfg(not(target_family = "wasm"))'.dependencies]
wgpu.workspace = true

[target.'cfg(target_family = "wasm")'.dependencies]
wgpu = { workspace = true, features = ["fragile-send-sync-non-atomic-wasm"] }

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[package.metadata.release]
tag = false
