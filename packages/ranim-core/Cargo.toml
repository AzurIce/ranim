[package]
name = "ranim-core"
description = "The core library of Ranim."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
ranim-macros.workspace = true
approx = "0.5.1"
dyn-clone = "1.0.20"
tracing.workspace = true
itertools.workspace = true
num = "0.4.3"
glam = { workspace = true, features = ["approx", "bytemuck"] }
bytemuck = { workspace = true, features = ["derive"] }
bevy_ecs.workspace = true
derive_more = { workspace = true, features = [
  "deref_mut",
  "deref",
  "index",
  "index_mut",
  "is_variant",
  "as_ref",
  "from",
  "into_iterator",
] }
color = "0.3.3"
variadics_please = "2.0.0"
symphonia = { workspace = true, optional = true }
rubato = { workspace = true, optional = true }
# `arena` feature: allocator-generic render items (nightly `allocator_api`).
bumpalo = { version = "3", optional = true, features = ["allocator_api"] }

[features]
# Decoding audio files (AudioClip::from_file / from_bytes) with pure-Rust
# symphonia and rubato, instead of piping through an ffmpeg binary.
audio-decode = ["dep:symphonia", "dep:rubato"]
# Allocator-generic render items + arena extraction path. Nightly-only
# (gates `allocator_api`); default builds stay stable.
arena = ["dep:bumpalo"]

[dev-dependencies]
assert_float_eq = "1.2.0"

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[package.metadata.release]
tag = false
