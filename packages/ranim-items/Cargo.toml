[package]
name = "ranim-items"
description = "The built-in items of Ranim."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
ranim-core.workspace = true
ranim-macros.workspace = true
tracing.workspace = true
itertools.workspace = true
derive_more = { workspace = true, features = [
  "deref_mut",
  "deref",
  "index",
  "index_mut",
  "is_variant",
  "as_ref",
  "from",
  "into_iterator",
] }
sha1 = { version = "0.11.0", optional = true }
lru = { version = "0.18.1", optional = true }
# glTF scene-graph import. `default-features` pulls `import` (image decoding
# + HTTP); only `utils` (accessor reading) and `names` (node name access) are
# needed, both dependency-free.
gltf = { version = "1.4.1", default-features = false, features = [
  "names",
  "utils",
], optional = true }
usvg = "0.47.0"
typst = { version = "0.15.1", optional = true }
typst-kit = { version = "0.15.1", default-features = false, features = [
  "scan-fonts",
  "embedded-fonts",
], optional = true }
# time = "0.3.41"
typst-svg = { version = "0.15.1", optional = true }
chrono = { version = "0.4.45", optional = true }
diff-match-patch-rs = { version = "0.5.1", optional = true }
regex = { version = "1.13.1", optional = true }

[features]
default = []
gltf = ["dep:gltf"]
typst = [
  "dep:chrono",
  "dep:diff-match-patch-rs",
  "dep:lru",
  "dep:regex",
  "dep:sha1",
  "dep:typst",
  "dep:typst-kit",
  "dep:typst-svg",
]

[dev-dependencies]
assert_float_eq = "1.2.0"

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[package.metadata.release]
tag = false
