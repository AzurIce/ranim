[package]
name = "ranim-items"
description = "The built-in items of Ranim."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
ranim-core.workspace = true
ranim-macros.workspace = true
ranim-typst = { workspace = true, optional = true }
typst = { version = "0.15.0", optional = true }
tracing.workspace = true
itertools.workspace = true
derive_more = { workspace = true, features = [
  "deref_mut",
  "deref",
  "index",
  "index_mut",
  "is_variant",
  "as_ref",
  "from",
  "into_iterator",
] }
usvg = "0.47.0"

[features]
default = []
typst = ["dep:ranim-typst", "dep:typst"]

[dev-dependencies]
assert_float_eq = "1.2.0"

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[package.metadata.release]
tag = false
