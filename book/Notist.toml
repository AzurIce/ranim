[package]
name = "ranim-book"

[site]
title = "Ranim Book"
content = "."
theme = "builtins.book"
directory_urls = true
copy_content_assets = false
exclude = ["**/AGENTS.md", "_components/**"]
styles = ["version-select.css"]
scripts = ["version-select.js"]

[site.extensions.builtins.book]
select = true

[[extensions]]
kind = "replace"
imports = { typst = "_components/typst/lib.notc" }
from = "notist.math"
to = "typst.math"
