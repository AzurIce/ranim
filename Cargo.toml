[package]
name = "ranim"
autoexamples = false
description = "An animation engine inspired by manim and JAnim"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage = "https://azurice.github.io/ranim"
readme = "README.md"
keywords = ["animation", "manim", "wgpu"]
exclude = ["website", "assets", "book"]

[lib]
crate-type = ["rlib"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[workspace]
members = ["benches", "example-packages/*", "packages/*", "xtasks/*"]

[workspace.package]
version = "0.2.1"
edition = "2024"
license = "MIT"
repository = "https://github.com/AzurIce/ranim"

[workspace.dependencies]
ranim = { path = ".", version = "0.2.1", default-features = false }
ranim-core = { path = "packages/ranim-core", version = "0.2.1" }
ranim-items = { path = "packages/ranim-items", version = "0.2.1" }
ranim-anims = { path = "packages/ranim-anims", version = "0.2.1" }
ranim-macros = { path = "packages/ranim-macros", version = "0.2.1" }
ranim-render = { path = "packages/ranim-render", version = "0.2.1" }
wgpu-profiler = "0.28.0"
wasm-bindgen = "0.2.129"
web-time = "1.1.0"
glam = "0.34.1"
tracing = "0.1.44"
tracing-indicatif = "0.3.14"
tracing-subscriber = "0.3.23"
itertools = "0.15.0"
bytemuck = "1.25.2"
wgpu = "30.0.1"
image = "0.25.10"
derive_more = "2.1.1"
bevy_ecs = { version = "0.20.0", default-features = false, features = ["std"] }
bevy_app = { version = "0.20.0", default-features = false, features = ["std"] }
bevy_derive = { version = "0.20.0", default-features = false }
# audio-decode feature (ranim-core): pure-Rust audio decoding + resampling
symphonia = { version = "0.6.1", default-features = false, features = [
  "aac",
  "flac",
  "mp3",
  "pcm",
  "vorbis",
  "isomp4",
  "ogg",
  "wav",
] }
rubato = "5.0"

[features]
default = ["anims", "items", "cmd-preview"]
anims = ["dep:ranim-anims", "items"]
items = ["dep:ranim-items"]
typst = ["items", "ranim-items/typst"]
gltf = ["items", "ranim-items/gltf"]
audio-decode = ["ranim-core/audio-decode"]
# Experimental native scene hotpatching through `dx serve --hotpatch`.
subsecond = ["dep:dioxus-devtools"]
render = [
  "ranim-items?/render",
  "dep:ranim-render",
  "dep:wgpu",
  "dep:wasm-bindgen",
  "dep:wasm-bindgen-futures",
  "dep:web-sys",
  "dep:js-sys",
  "dep:console_error_panic_hook",
]
cmd-render = [
  "render",
  "dep:pollster",
  "dep:which",
  "dep:indicatif",
  "dep:tracing-indicatif",
  "dep:tracing-subscriber",
  "dep:flate2",
  "dep:reqwest",
  "dep:clap",
  "dep:serde",
  "dep:serde_json",
  "dep:async-channel",
  "dep:anyhow",
]
cmd-preview = [
  "cmd-render",
  "dep:rodio",
  "dep:egui",
  "dep:eframe",
  "dep:egui-phosphor",
  "dep:web-time",
  "dep:bytemuck",
  "dep:wgpu-profiler",
]

[dependencies]
ranim-core.workspace = true
ranim-items = { workspace = true, optional = true }
ranim-anims = { workspace = true, optional = true }
ranim-macros.workspace = true
itertools.workspace = true
tracing.workspace = true
bevy_app.workspace = true
bevy_ecs.workspace = true
derive_more = { workspace = true, features = [
  "deref_mut",
  "deref",
  "index",
  "index_mut",
  "is_variant",
  "as_ref",
  "from",
  "into_iterator",
] }
ranim-render = { workspace = true, optional = true }
# render feature (wasm-compatible deps here, rest in target-specific section below)
wgpu = { workspace = true, optional = true }

[target.'cfg(target_family = "wasm")'.dependencies]
js-sys = { version = "0.3.106", optional = true }
wasm-bindgen = { workspace = true, optional = true }
console_error_panic_hook = { version = "0.1.7", optional = true }
wasm-bindgen-futures = { version = "0.4.79", optional = true }
web-sys = { version = "0.3.106", features = ["HtmlCanvasElement"], optional = true }

[target.'cfg(not(target_family = "wasm"))'.dependencies]
dioxus-devtools = { version = "0.7.10", optional = true }
# Native command rendering and CLI dependencies.
anyhow = { version = "1.0.104", optional = true }
async-channel = { version = "2.5.0", optional = true }
pollster = { version = "1.0.1", optional = true }
which = { version = "8.0.6", optional = true }
indicatif = { version = "0.18.6", optional = true }
tracing-indicatif = { workspace = true, optional = true }
tracing-subscriber = { workspace = true, features = ["env-filter"], optional = true }
flate2 = { version = "1.1.10", optional = true }
reqwest = { version = "0.13.5", features = ["blocking"], optional = true }
# cli/inspect (native only)
clap = { version = "4.6.7", features = ["derive"], optional = true }
serde = { version = "1.0.229", features = ["derive"], optional = true }
serde_json = { version = "1.0.151", optional = true }
# cmd-preview feature (native)
egui = { version = "0.36.2", optional = true }
egui-phosphor = { version = "0.14.0", optional = true }
web-time = { workspace = true, optional = true }
bytemuck = { workspace = true, features = ["derive"], optional = true }
wgpu-profiler = { workspace = true, optional = true }
eframe = { version = "0.36.2", features = ["wgpu"], optional = true }
# Native preview plays the scene's baked PCM; decoding belongs to audio-decode.
rodio = { version = "0.22", default-features = false, features = ["playback"], optional = true }

[target.'cfg(not(target_family = "wasm"))'.dev-dependencies]
pretty_env_logger = "0.5.0"

[dev-dependencies]
assert_float_eq = "1.2.0"
midly = "0.5.3"
rand = "0.10.3"
rand_chacha = "0.10.0"
getrandom = { version = "0.4.3", features = ["wasm_js"] }

# Enable a small amount of optimization in the dev profile.
[profile.dev]
opt-level = 1

# Enable a large amount of optimization in the dev profile for dependencies.
[profile.dev.package."*"]
opt-level = 3

[package.metadata.release]
pre-release-hook = [
  "git",
  "cliff",
  "-o",
  "CHANGELOG.md",
  "--tag",
  "{{version}}",
]
pre-release-replacements = [
  { file = "README.md", search = "ranim = \"[^\"]+\"", replace = "{{crate_name}} = \"{{version}}\"" },
]

