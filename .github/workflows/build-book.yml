name: Build Book

on:
  workflow_call:
    inputs:
      ref:
        description: "Git ref to build"
        type: string
        required: true
      artifact-name:
        description: "Name for the uploaded artifact"
        type: string
        required: true
      mdbook-version:
        description: "mdbook version"
        type: string
        default: "0.5.4"
      mdbook-plugins:
        description: "Comma-separated mdbook plugins"
        type: string
        default: "mdbook-mermaid@0.17"
      mdbook-typst-math-rev:
        description: "mdbook-typst-math revision from duskmoon314/mdbook-typst-math"
        type: string
        default: "52341bd8ec2ffde6db92cfd5e5d7503076fbd94e"
      site-url:
        description: "Override site-url (e.g. /ranim-book/). If empty, derived from ref."
        type: string
        default: ""

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - name: Fetch version-select assets from main
        uses: actions/checkout@v4
        with:
          ref: main
          sparse-checkout: .github/book-assets
          path: __main

      - name: Detect book format
        id: format
        run: |
          if [ -f book/Notist.toml ]; then
            echo "notist=true" >> "$GITHUB_OUTPUT"
          else
            echo "notist=false" >> "$GITHUB_OUTPUT"
          fi
          if [ -f Notist.toml ] && [ -f book/Notist.toml ]; then
            echo "workspace=true" >> "$GITHUB_OUTPUT"
            echo "book-output=dist/ranim-book/book" >> "$GITHUB_OUTPUT"
          else
            echo "workspace=false" >> "$GITHUB_OUTPUT"
            echo "book-output=book/build" >> "$GITHUB_OUTPUT"
          fi

      - name: Install Nix
        if: steps.format.outputs.notist == 'true'
        uses: cachix/install-nix-action@v31

      - name: Build Notist book
        if: steps.format.outputs.notist == 'true'
        run: |
          mkdir -p target
          nix build .#notist --out-link target/notist
          if [ "${{ steps.format.outputs.workspace }}" = "true" ]; then
            target/notist/bin/notist build -p ranim-book
          else
            # Older Notist revisions still use the standalone book configuration.
            target/notist/bin/notist book build book --out-dir book/build
          fi

      - name: Compute tool cache key
        if: steps.format.outputs.notist != 'true'
        id: tool-key
        run: echo "hash=$(echo '${{ inputs.mdbook-version }} ${{ inputs.mdbook-plugins }} ${{ inputs.mdbook-typst-math-rev }}' | sha256sum | cut -c1-16)-issue-links-$(git rev-parse HEAD:book/preprocessors/issue_links.rs)" >> "$GITHUB_OUTPUT"

      - name: Cache mdbook tools
        if: steps.format.outputs.notist != 'true'
        id: cache-mdbook
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/mdbook
            ~/.cargo/bin/mdbook-*
            ~/.cargo/registry
          key: mdbook-${{ steps.tool-key.outputs.hash }}

      # The repo-local issue-links preprocessor (book/preprocessors/
      # issue_links.rs) is a rust script run via `cargo -Zscript` from
      # book.toml — needs the nightly the repo pins (see flake.nix).
      - name: Install Rust toolchain (for the issue-links preprocessor)
        if: steps.format.outputs.notist != 'true'
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-10-01

      - name: Install mdbook and registry plugins
        if: steps.format.outputs.notist != 'true' && steps.cache-mdbook.outputs.cache-hit != 'true'
        uses: taiki-e/install-action@v2
        with:
          tool: mdbook@${{ inputs.mdbook-version }}, ${{ inputs.mdbook-plugins }}

      - name: Install mdbook-typst-math from upstream
        if: steps.format.outputs.notist != 'true' && steps.cache-mdbook.outputs.cache-hit != 'true'
        run: cargo install --locked --git https://github.com/duskmoon314/mdbook-typst-math.git --rev "${{ inputs.mdbook-typst-math-rev }}" mdbook-typst-math

      - name: Patch book.toml and inject version-select
        if: steps.format.outputs.notist != 'true'
        run: |
          SITE_URL="${{ inputs.site-url }}"
          if [ -z "$SITE_URL" ]; then
            REF="${{ inputs.ref }}"
            TAG="${REF#refs/tags/}"
            SITE_URL="/ranim-book/${TAG}/"
          fi

          sed -i "s|site-url = .*|site-url = \"${SITE_URL}\"|" book/book.toml
          sed -i "s|build-dir = .*|build-dir = \"build\"|" book/book.toml

          # Inject version-select assets
          cp __main/.github/book-assets/version-select.js book/
          cp __main/.github/book-assets/version-select.css book/

          # Append to additional-css / additional-js, or add them
          if grep -q 'additional-css' book/book.toml; then
            sed -i 's|additional-css = \[|additional-css = ["version-select.css", |' book/book.toml
          else
            echo 'additional-css = ["version-select.css"]' >> book/book.toml
          fi
          if grep -q 'additional-js' book/book.toml; then
            sed -i 's|additional-js *= *\[|additional-js  = ["version-select.js", |' book/book.toml
          else
            echo 'additional-js = ["version-select.js"]' >> book/book.toml
          fi

      - name: Build legacy mdBook
        if: steps.format.outputs.notist != 'true'
        run: mdbook build book

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.artifact-name }}
          path: ${{ steps.format.outputs.book-output }}
