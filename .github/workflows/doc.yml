name: Doc

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: "doc-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  build-doc:
    runs-on: ubuntu-22.04
    if: github.repository == 'AzurIce/ranim'
    steps:
      - uses: actions/checkout@v4

      - name: Install rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-10-01
          targets: wasm32-unknown-unknown

      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-bindgen@0.2.129

      - name: Install wasm-opt
        run: |
          curl -sSL -o /tmp/binaryen.tar.gz \
            "https://github.com/WebAssembly/binaryen/releases/download/version_129/binaryen-version_129-x86_64-linux.tar.gz"
          tar -xzf /tmp/binaryen.tar.gz -C /tmp
          echo "/tmp/binaryen-version_129/bin" >> "$GITHUB_PATH"

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: "doc"

      # rodio/cpal builds alsa-sys on native targets when cmd-preview is enabled.
      - name: Install ALSA headers
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev

      - name: Build rustdoc
        run: RUSTDOCFLAGS="--cfg docsrs --html-in-header packages/ranim-examples/docs-rs/header.html" cargo doc --workspace --no-deps --document-private-items --all-features --exclude app --exclude xtask-examples --exclude benches

      - name: Build example doc wasm
        run: cargo examples build --out-dir target/doc/ranim_examples

      - uses: actions/upload-artifact@v4
        with:
          name: doc
          path: target/doc

  deploy-doc:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    needs: build-doc
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: doc
          path: doc-output

      - name: Deploy to ranim-doc
        uses: peaceiris/actions-gh-pages@v4
        with:
          deploy_key: ${{ secrets.DOC_DEPLOY_KEY }}
          external_repository: AzurIce/ranim-doc
          publish_dir: ./doc-output
          force_orphan: true
