name: Website

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Per-ref/PR concurrency: different branches do not cancel each other;
# a newer run of the same branch/PR cancels the stale one. Main pushes share
# one group so the Pages deploy is serialized (newest wins).
concurrency:
  group: "pages-${{ github.event.pull_request.number || github.ref }}"
  cancel-in-progress: true

jobs:
  build-website:
    runs-on: ubuntu-22.04
    if: github.repository == 'AzurIce/ranim'
    steps:
      - uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-05-01
          targets: wasm32-unknown-unknown

      - uses: taiki-e/install-action@v2
        with:
          tool: just, zola@0.22, wasm-bindgen

      # Binaryen must be >= 110. Older versions (e.g. Ubuntu 22.04's apt
      # binaryen 105) mislabel the `__wbindgen_externrefs` export as the funcref
      # table when running `wasm-opt` on wasm-bindgen output, so
      # `__wbindgen_init_externref_table` fails with
      # `WebAssembly.Table.grow(): failed to grow table by N` at module init.
      # Pin a modern release instead of using apt.
      - name: Install wasm-opt
        run: |
          curl -sSL -o /tmp/binaryen.tar.gz \
            "https://github.com/WebAssembly/binaryen/releases/download/version_129/binaryen-version_129-x86_64-linux.tar.gz"
          tar -xzf /tmp/binaryen.tar.gz -C /tmp
          echo "/tmp/binaryen-version_129/bin" >> "$GITHUB_PATH"

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: "wasm-examples"

      - name: Build wasm examples
        run: cargo examples build

      - run: just website

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v1.0.7
        with:
          path: ./website/public

  deploy-website:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    needs: build-website
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages site
        id: deployment
        uses: actions/deploy-pages@v4
