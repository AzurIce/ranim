code = """
`scenes.rs`（共享场景与项目装配）

```rust
use ranim::{
    anims::fading::FadingAnim, color::palettes::manim, items::vitem::geometry::Square, prelude::*,
    utils::rate_functions::smooth,
};

// ANCHOR: construct
#[scene]
#[wasm_demo_doc]
#[output(dir = "./output/getting_started0")]
fn getting_started0(r: &mut RanimScene) {
    // A Square with size 2.0 and color blue
    let square = Square::new(2.0).with(|square| {
        square.set_color(manim::BLUE_C);
    });

    let mut content = seq![square.clone().fade_in().with_rate_func(smooth)];
    content
        .hold(1.0)
        .push(square.hide())
        .forward(1.0)
        .push(square.show())
        .hold(1.0)
        .push(square.clone().fade_out().with_rate_func(smooth));

    r.play(
        CameraFrame::default()
            .show()
            .with_duration(content.cursor_sec()),
    );
    r.play(content);
    r.insert_time_mark(1.0, TimeMark::Capture("preview.png".to_string()));
}
// ANCHOR_END: construct

/// Register the scenes provided by this example.
pub struct ScenesPlugin;

impl ranim::Plugin for ScenesPlugin {
    fn build(&self, app: &mut bevy_app::App) {
        app.add_scenes([getting_started0::scene()]);
    }
}
```

`main.rs`（原生入口）

```rust
#![cfg_attr(target_arch = "wasm32", no_main)]
#![cfg(not(target_arch = "wasm32"))]

mod scenes;

fn main() {
    use ranim::prelude::*;
    let mut app = App::new();
    app.add_plugins(scenes::ScenesPlugin);
    run_cli(app.build());
}
```

`wasm.rs`（WASM 入口）

```rust
//! WebAssembly entry; project assembly is shared with the native binary.

#![cfg(target_arch = "wasm32")]

mod scenes;

#[wasm_bindgen::prelude::wasm_bindgen]
pub fn app() -> ranim::wasm::WasmApp {
    use ranim::prelude::*;

    let mut app = App::new();
    app.add_plugins(scenes::ScenesPlugin);
    ranim::wasm::WasmApp::new(app.build())
}
```"""
