
{% extends "layouts/three-col.html" %}

{% block left_side %}
{% set examples_section = get_section(path="examples/_index.md") %}
<div class="outline">
  <div class="outline__content">
    <ul>
      {{ <examples.nav section={examples_section} current={section_or_page} /> }}
    </ul>
  </div>
</div>
{% endblock left_side %}

{% block content %}
<article class="markdown-body examples-article">
  {{ <examples.breadcrumbs current={section_or_page} /> }}
  {{ <examples.content content={section_or_page.content} /> }}
</article>
{% endblock content %}
